server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: las rutas de Angular (/login, /) las resuelve el router del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html siempre fresco; los bundles llevan hash en el nombre y se pueden cachear.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
